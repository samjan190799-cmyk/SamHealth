name: Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build Number (оставьте пустым для авто-номера)'
        required: false
        default: ''
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    env:
      P12_CERT_SECRET: ${{ secrets.P12_CERTIFICATE_BASE64 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Setup App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ~/.private_keys
          echo "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          echo "$API_KEY_CONTENT" > ~/.private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.private_keys/AuthKey_${KEY_ID}.p8
          echo "App Store Connect API Key installed successfully."

      - name: Prepare Provisioning Profile Directories
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData"
          rm -rf "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          ln -s "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          echo "Provisioning profile directories synchronized."

      - name: Setup Distribution Certificate & Keychain
        if: env.P12_CERT_SECRET != ''
        env:
          P12_BASE64: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: "temporary-keychain-pass"
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Декодирование и импорт сертификата
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          echo "Keychain configured and certificate imported."

      - name: Configure Build Number
        id: build_info
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            BUILD_NUM="${{ inputs.build_number }}"
          else
            BUILD_NUM="${{ github.run_number }}"
          fi
          echo "BUILD_NUMBER=$BUILD_NUM" >> $GITHUB_ENV
          echo "Building Version 1.0 (Build $BUILD_NUM)"

      - name: Update Version and Team in project.yml & Info.plist
        env:
          DEV_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          sed -i '' "s/CFBundleVersion: .*/CFBundleVersion: \"$BUILD_NUMBER\"/" project.yml || true
          sed -i '' "s/<string>1<\/string>/<string>$BUILD_NUMBER<\/string>/" Sources/Info.plist || true
          
          if [ -n "$DEV_TEAM" ]; then
            echo "Setting DEVELOPMENT_TEAM to $DEV_TEAM in project.yml"
            sed -i '' "s/DEVELOPMENT_TEAM: .*/DEVELOPMENT_TEAM: \"$DEV_TEAM\"/" project.yml || true
          fi

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Create ExportOptions.plist
        env:
          DEV_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$DEV_TEAM</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF
          cat ExportOptions.plist

      - name: Build Archive for TestFlight
        env:
          DEV_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -o pipefail
          
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData"
          rm -rf "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          ln -sf "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          
          TEAM_ARG=""
          if [ -n "$DEV_TEAM" ]; then
            TEAM_ARG="DEVELOPMENT_TEAM=$DEV_TEAM"
          fi
          
          xcodebuild archive \
            -project Forma.xcodeproj \
            -scheme Forma \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/Forma.xcarchive \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_ENTITLEMENTS="${PWD}/Forma.entitlements" \
            OTHER_CODE_SIGN_FLAGS="--entitlements ${PWD}/Forma.entitlements" \
            $TEAM_ARG

      - name: Prepare Archive Entitlements & Inspect
        env:
          DEV_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -o pipefail
          
          # Формируем полный xcent файл со всеми энтитлментами для архива
          cat <<'EOF' > /tmp/full_entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>${DEV_TEAM}.com.samvel.forma</string>
              <key>beta-reports-active</key>
              <true/>
              <key>com.apple.developer.healthkit</key>
              <true/>
              <key>com.apple.developer.healthkit.access</key>
              <array>
                  <string>health-records</string>
              </array>
              <key>com.apple.developer.healthkit.background-delivery</key>
              <true/>
              <key>com.apple.developer.team-identifier</key>
              <string>${DEV_TEAM}</string>
              <key>get-task-allow</key>
              <false/>
          </dict>
          </plist>
          EOF
          sed -i '' "s/\${DEV_TEAM}/$DEV_TEAM/g" /tmp/full_entitlements.plist || true
          
          # Внедряем xcent во все точки xcarchive
          mkdir -p build/Forma.xcarchive/Products/Applications/Forma.app
          cp /tmp/full_entitlements.plist build/Forma.xcarchive/archived-expanded-entitlements.xcent
          cp /tmp/full_entitlements.plist build/Forma.xcarchive/Products/Applications/Forma.app/archived-expanded-entitlements.xcent
          
          # Записываем энтитлменты в Info.plist архива для exportArchive
          /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:Entitlements dict" build/Forma.xcarchive/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:Entitlements:com.apple.developer.healthkit bool true" build/Forma.xcarchive/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:Entitlements:com.apple.developer.healthkit true" build/Forma.xcarchive/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:Entitlements:com.apple.developer.healthkit.access array" build/Forma.xcarchive/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:Entitlements:com.apple.developer.healthkit.access:0 string health-records" build/Forma.xcarchive/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:Entitlements:com.apple.developer.healthkit.background-delivery bool true" build/Forma.xcarchive/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:Entitlements:com.apple.developer.healthkit.background-delivery true" build/Forma.xcarchive/Info.plist || true
          
          echo "=== ARCHIVE EXPANDED ENTITLEMENTS ==="
          cat build/Forma.xcarchive/archived-expanded-entitlements.xcent || true
          
          echo "=== ARCHIVE CODESIGN ENTITLEMENTS ==="
          codesign -d --entitlements :- build/Forma.xcarchive/Products/Applications/Forma.app || true

      - name: Export & Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DEV_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -o pipefail
          
          # Формируем валидный xcent файл со всеми энтитлментами для архива
          cat <<'EOF' > /tmp/full_entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>${DEV_TEAM}.com.samvel.forma</string>
              <key>beta-reports-active</key>
              <true/>
              <key>com.apple.developer.healthkit</key>
              <true/>
              <key>com.apple.developer.healthkit.access</key>
              <array>
                  <string>health-records</string>
              </array>
              <key>com.apple.developer.healthkit.background-delivery</key>
              <true/>
              <key>com.apple.developer.team-identifier</key>
              <string>${DEV_TEAM}</string>
              <key>get-task-allow</key>
              <false/>
          </dict>
          </plist>
          EOF
          sed -i '' "s/\${DEV_TEAM}/$DEV_TEAM/g" /tmp/full_entitlements.plist || true
          mkdir -p build/Forma.xcarchive/Products/Applications/Forma.app
          cp /tmp/full_entitlements.plist build/Forma.xcarchive/archived-expanded-entitlements.xcent
          cp /tmp/full_entitlements.plist build/Forma.xcarchive/Products/Applications/Forma.app/archived-expanded-entitlements.xcent
          
          # Записываем энтитлменты в Info.plist архива для exportArchive
          /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:Entitlements dict" build/Forma.xcarchive/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:Entitlements:com.apple.developer.healthkit bool true" build/Forma.xcarchive/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:Entitlements:com.apple.developer.healthkit true" build/Forma.xcarchive/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:Entitlements:com.apple.developer.healthkit.access array" build/Forma.xcarchive/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:Entitlements:com.apple.developer.healthkit.access:0 string health-records" build/Forma.xcarchive/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ApplicationProperties:Entitlements:com.apple.developer.healthkit.background-delivery bool true" build/Forma.xcarchive/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:Entitlements:com.apple.developer.healthkit.background-delivery true" build/Forma.xcarchive/Info.plist || true
          
          # Экспорт архива в IPA
          xcodebuild -exportArchive \
            -archivePath build/Forma.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
            
          # Гарантированное внедрение энтитлментов и переподпись IPA
          IPA_PATH=$(find build -name "*.ipa" | head -1)
          if [ -n "$IPA_PATH" ]; then
            echo "Found IPA at $IPA_PATH. Verifying and enforcing entitlements..."
            ROOT_DIR="$PWD"
            mkdir -p /tmp/ipa_work
            unzip -q "$IPA_PATH" -d /tmp/ipa_work
            
            echo "=== EXTRACTED EMBEDDED PROVISIONING ==="
            if [ -f "/tmp/ipa_work/Payload/Forma.app/embedded.mobileprovision" ]; then
              security cms -D -i "/tmp/ipa_work/Payload/Forma.app/embedded.mobileprovision" > /tmp/provision.plist
              /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' /tmp/provision.plist > /tmp/target_entitlements.plist || true
              cat /tmp/target_entitlements.plist || true
            else
              cp /tmp/full_entitlements.plist /tmp/target_entitlements.plist
            fi
            
            echo "=== CURRENT IPA CODESIGN ENTITLEMENTS ==="
            ENTITLEMENTS_OUTPUT=$(codesign -d --entitlements :- /tmp/ipa_work/Payload/Forma.app 2>&1 || true)
            echo "$ENTITLEMENTS_OUTPUT"
            
            # Если HealthKit не был внедрен автоматически, выполняем переподпись
            if ! echo "$ENTITLEMENTS_OUTPUT" | grep -q "com.apple.developer.healthkit"; then
              echo "HealthKit entitlement missing in IPA binary signature. Searching for signing identity..."
              CERT_IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null | grep "Apple Distribution" | head -1 | awk -F '"' '{print $2}' || true)
              KEYCHAIN_FILE=""
              if [ -z "$CERT_IDENTITY" ]; then
                for kc in $(find /var/folders /private/var/folders "$HOME/Library/Keychains" /Library/Keychains /tmp -type f \( -name "*.keychain" -o -name "*.keychain-db" \) 2>/dev/null); do
                  FOUND_ID=$(security find-identity -v -p codesigning "$kc" 2>/dev/null | grep "Apple Distribution" | head -1 | awk -F '"' '{print $2}' || true)
                  if [ -n "$FOUND_ID" ]; then
                    CERT_IDENTITY="$FOUND_ID"
                    KEYCHAIN_FILE="$kc"
                    echo "Found Apple Distribution in keychain $kc: $CERT_IDENTITY"
                    break
                  fi
                done
              fi
              
              if [ -n "$CERT_IDENTITY" ]; then
                echo "Re-signing binary with identity: $CERT_IDENTITY"
                KEYCHAIN_ARG=""
                if [ -n "$KEYCHAIN_FILE" ]; then
                  KEYCHAIN_ARG="--keychain $KEYCHAIN_FILE"
                fi
                codesign --force --sign "$CERT_IDENTITY" $KEYCHAIN_ARG --entitlements /tmp/target_entitlements.plist --generate-entitlement-der --timestamp=none /tmp/ipa_work/Payload/Forma.app/Forma || true
                codesign --force --sign "$CERT_IDENTITY" $KEYCHAIN_ARG --entitlements /tmp/target_entitlements.plist --generate-entitlement-der --timestamp=none /tmp/ipa_work/Payload/Forma.app || true
                
                # Переупаковываем IPA
                rm -f "$IPA_PATH"
                (cd /tmp/ipa_work && zip -qr "$ROOT_DIR/$IPA_PATH" Payload)
              fi
            fi
            
            echo "=== FINAL VERIFIED ENTITLEMENTS ==="
            codesign -d --entitlements :- /tmp/ipa_work/Payload/Forma.app || true
            rm -rf /tmp/ipa_work
            
            echo "Uploading finalized $IPA_PATH to TestFlight via xcrun altool..."
            xcrun altool --upload-app \
              -f "$IPA_PATH" \
              -t ios \
              --apiKey "$KEY_ID" \
              --apiIssuer "$ISSUER_ID"
            echo "Uploaded to TestFlight successfully!"
          else
            echo "Error: No IPA file was generated by exportArchive!"
            exit 1
          fi

      - name: Upload Artifacts (Diagnostics & dSYMs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestFlight-Build-${{ env.BUILD_NUMBER }}
          path: |
            build/*.ipa
            build/*.xcarchive/dSYMs
          if-no-files-found: ignore
          retention-days: 14
