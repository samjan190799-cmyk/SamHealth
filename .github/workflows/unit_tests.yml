name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - master
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'project.yml'
      - 'scripts/ios_unit_tests.sh'
      - '.github/workflows/unit_tests.yml'
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: XCTest (iOS Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Run Unit Tests
        run: |
          bash scripts/ios_unit_tests.sh

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Forma-Unit-Test-Results
          path: test_results
          if-no-files-found: ignore
          retention-days: 14
