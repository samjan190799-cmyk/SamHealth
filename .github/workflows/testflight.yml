name: Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build Number (оставьте пустым для авто-номера)'
        required: false
        default: ''
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    env:
      P12_CERT_SECRET: ${{ secrets.P12_CERTIFICATE_BASE64 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Setup App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          mkdir -p ~/.private_keys
          echo "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          echo "$API_KEY_CONTENT" > ~/.private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.private_keys/AuthKey_${KEY_ID}.p8
          echo "App Store Connect API Key installed successfully."

      - name: Prepare Provisioning Profile Directories
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData"
          rm -rf "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          ln -s "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          echo "Provisioning profile directories synchronized."

      - name: Setup Distribution Certificate & Keychain (Secret Fallback)
        if: env.P12_CERT_SECRET != ''
        env:
          P12_BASE64: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: "temporary-keychain-pass"
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Декодирование и импорт сертификата
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          echo "Keychain configured and certificate imported."

      - name: Configure Build Number
        id: build_info
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            BUILD_NUM="${{ inputs.build_number }}"
          else
            BUILD_NUM="${{ github.run_number }}"
          fi
          echo "BUILD_NUMBER=$BUILD_NUM" >> $GITHUB_ENV
          echo "Building Version 1.0 (Build $BUILD_NUM)"

      - name: Update Version and Team in project.yml & Info.plist
        env:
          DEV_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          sed -i '' "s/CFBundleVersion: .*/CFBundleVersion: \"$BUILD_NUMBER\"/g" project.yml || true
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/g" project.yml || true
          sed -i '' "s/<string>1<\/string>/<string>$BUILD_NUMBER<\/string>/g" Sources/Info.plist || true
          sed -i '' "s/<string>1<\/string>/<string>$BUILD_NUMBER<\/string>/g" WatchSources/Info.plist || true
          sed -i '' "s/<string>1<\/string>/<string>$BUILD_NUMBER<\/string>/g" Widgets/Info.plist || true
          
          if [ -n "$DEV_TEAM" ]; then
            echo "Setting DEVELOPMENT_TEAM to $DEV_TEAM in project.yml"
            sed -i '' "s/DEVELOPMENT_TEAM: .*/DEVELOPMENT_TEAM: \"$DEV_TEAM\"/g" project.yml || true
          fi

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Setup Certificates & Provisioning via App Store Connect API
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          DEV_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          gem install --quiet spaceship || true
          ruby scripts/ci_provisioning.rb || (python3 -m pip install --quiet pyjwt cryptography requests --break-system-packages && python3 scripts/ci_provisioning.py)

      - name: Build Archive for TestFlight
        env:
          DEV_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData"
          rm -rf "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          ln -sf "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          
          TEAM_ARG=""
          if [ -n "$DEV_TEAM" ]; then
            TEAM_ARG="DEVELOPMENT_TEAM=$DEV_TEAM"
          fi
          
          xcodebuild archive \
            -project Forma.xcodeproj \
            -scheme Forma \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/Forma.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="${PWD}/Forma.entitlements" \
            $TEAM_ARG

      - name: Export & Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DEV_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -o pipefail
          
          # Формируем fallback xcent файл
          cat <<'EOF' > /tmp/full_entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>${DEV_TEAM}.com.samvel.forma</string>
              <key>beta-reports-active</key>
              <true/>
              <key>com.apple.developer.healthkit</key>
              <true/>
              <key>com.apple.developer.healthkit.access</key>
              <array>
                  <string>health-records</string>
              </array>
              <key>com.apple.developer.healthkit.background-delivery</key>
              <true/>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>group.com.samvel.forma</string>
              </array>
              <key>com.apple.developer.team-identifier</key>
              <string>${DEV_TEAM}</string>
              <key>get-task-allow</key>
              <false/>
          </dict>
          </plist>
          EOF
          sed -i '' "s/\${DEV_TEAM}/$DEV_TEAM/g" /tmp/full_entitlements.plist || true
          
          # Создаем структуру IPA из xcarchive
          ROOT_DIR="$PWD"
          rm -rf /tmp/ipa_work
          mkdir -p /tmp/ipa_work/Payload
          cp -R build/Forma.xcarchive/Products/Applications/Forma.app /tmp/ipa_work/Payload/
          
          # 1. Внедряем provisioning profiles для основного приложения
          if [ -f "/tmp/profiles/com.samvel.forma.mobileprovision" ]; then
            echo "Embedding com.samvel.forma profile into Forma.app"
            cp /tmp/profiles/com.samvel.forma.mobileprovision /tmp/ipa_work/Payload/Forma.app/embedded.mobileprovision
          fi
          
          # Фолбек на поиск в системной директории профилей
          if [ ! -f "/tmp/ipa_work/Payload/Forma.app/embedded.mobileprovision" ]; then
            for f in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
              if [ -f "$f" ]; then
                if security cms -D -i "$f" 2>/dev/null | grep -q "com.samvel.forma"; then
                  echo "Found matching profile in system library: $f"
                  cp "$f" /tmp/ipa_work/Payload/Forma.app/embedded.mobileprovision
                  break
                fi
              fi
            done
          fi
          
          # Проверка обязательного наличия embedded.mobileprovision
          if [ ! -f "/tmp/ipa_work/Payload/Forma.app/embedded.mobileprovision" ]; then
            echo "❌ CRITICAL ERROR: embedded.mobileprovision is missing for Forma.app!"
            exit 1
          fi
          
          # 2. Внедряем provisioning profile для Widgets Extension
          if [ -d "/tmp/ipa_work/Payload/Forma.app/PlugIns/FormaWidgets.appex" ]; then
            if [ -f "/tmp/profiles/com.samvel.forma.widgets.mobileprovision" ]; then
              echo "Embedding widgets profile into FormaWidgets.appex"
              cp /tmp/profiles/com.samvel.forma.widgets.mobileprovision /tmp/ipa_work/Payload/Forma.app/PlugIns/FormaWidgets.appex/embedded.mobileprovision
            fi
            if [ ! -f "/tmp/ipa_work/Payload/Forma.app/PlugIns/FormaWidgets.appex/embedded.mobileprovision" ]; then
              for f in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
                if [ -f "$f" ]; then
                  if security cms -D -i "$f" 2>/dev/null | grep -q "com.samvel.forma.widgets"; then
                    echo "Found matching widgets profile in system library: $f"
                    cp "$f" /tmp/ipa_work/Payload/Forma.app/PlugIns/FormaWidgets.appex/embedded.mobileprovision
                    break
                  fi
                fi
              done
            fi
          fi
          
          # 3. Внедряем provisioning profile для Watch App
          if [ -d "/tmp/ipa_work/Payload/Forma.app/Watch/FormaWatch.app" ]; then
            if [ -f "/tmp/profiles/com.samvel.forma.watchkitapp.mobileprovision" ]; then
              echo "Embedding watch profile into FormaWatch.app"
              cp /tmp/profiles/com.samvel.forma.watchkitapp.mobileprovision /tmp/ipa_work/Payload/Forma.app/Watch/FormaWatch.app/embedded.mobileprovision
            fi
            if [ ! -f "/tmp/ipa_work/Payload/Forma.app/Watch/FormaWatch.app/embedded.mobileprovision" ]; then
              for f in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision; do
                if [ -f "$f" ]; then
                  if security cms -D -i "$f" 2>/dev/null | grep -q "com.samvel.forma.watchkitapp"; then
                    echo "Found matching watch profile in system library: $f"
                    cp "$f" /tmp/ipa_work/Payload/Forma.app/Watch/FormaWatch.app/embedded.mobileprovision
                    break
                  fi
                fi
              done
            fi
          fi
          
          # 4. Синхронизация версий во всех Info.plist внутри IPA
          echo "=== SYNCHRONIZING VERSIONS ACROSS ALL BUNDLES ==="
          find /tmp/ipa_work/Payload -name "Info.plist" | while read -r plist_file; do
            echo "Syncing CFBundleVersion to $BUILD_NUMBER in $plist_file"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$plist_file" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$plist_file" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" "$plist_file" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" "$plist_file" 2>/dev/null || true
          done
          
          # 5. Гарантируем правильные ключи в Widgets Info.plist (NSExtensionPointIdentifier)
          find /tmp/ipa_work -name "Info.plist" | grep -i "FormaWidgets.appex" | while read -r winfo; do
            echo "Enforcing NSExtension in $winfo"
            /usr/libexec/PlistBuddy -c "Add :NSExtension dict" "$winfo" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSExtension:NSExtensionPointIdentifier string com.apple.widgetkit-extension" "$winfo" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSExtension:NSExtensionPointIdentifier com.apple.widgetkit-extension" "$winfo" || true
          done
          
          # 6. Гарантируем правильные ключи в Watch Info.plist (single-target watchOS app & AppIcon)
          find /tmp/ipa_work -name "Info.plist" | grep -i "FormaWatch.app" | while read -r winfo; do
            echo "Enforcing single-target watch keys and icons in $winfo"
            /usr/libexec/PlistBuddy -c "Add :WKApplication bool true" "$winfo" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :WKApplication true" "$winfo" || true
            /usr/libexec/PlistBuddy -c "Delete :WKWatchKitApp" "$winfo" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :WKCompanionAppBundleIdentifier string com.samvel.forma" "$winfo" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :WKCompanionAppBundleIdentifier com.samvel.forma" "$winfo" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$winfo" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$winfo" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$winfo" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$winfo" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$winfo" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$winfo" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0 string AppIcon" "$winfo" 2>/dev/null || true
          done
          
          # 7. Извлечение точных энтитлментов из профиля
          security cms -D -i "/tmp/ipa_work/Payload/Forma.app/embedded.mobileprovision" > /tmp/main_prov.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' /tmp/main_prov.plist > /tmp/forma_entitlements.plist 2>/dev/null || cp /tmp/full_entitlements.plist /tmp/forma_entitlements.plist
          
          # Гарантируем App Group в forma_entitlements.plist
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups array" /tmp/forma_entitlements.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups:0 string group.com.samvel.forma" /tmp/forma_entitlements.plist 2>/dev/null || true
          
          # Поиск сертификата Apple Distribution
          CERT_IDENTITY=""
          if [ -f "/tmp/signing_identity.txt" ]; then
            CERT_IDENTITY=$(cat /tmp/signing_identity.txt | tr -d '[:space:]')
            echo "Using verified Distribution SHA-1 from provisioning step: $CERT_IDENTITY"
          fi
          
          if [ -z "$CERT_IDENTITY" ]; then
            CERT_IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null | grep "Apple Distribution" | head -1 | awk -F '"' '{print $2}' || true)
          fi
          
          KEYCHAIN_FILE="/tmp/build.keychain"
          if [ ! -f "$KEYCHAIN_FILE" ]; then
            for kc in $(find /var/folders /private/var/folders "$HOME/Library/Keychains" /Library/Keychains /tmp -type f \( -name "*.keychain" -o -name "*.keychain-db" \) 2>/dev/null); do
              FOUND_ID=$(security find-identity -v -p codesigning "$kc" 2>/dev/null | grep "Apple Distribution" | head -1 | awk -F '"' '{print $2}' || true)
              if [ -n "$FOUND_ID" ]; then
                KEYCHAIN_FILE="$kc"
                echo "Found Keychain: $kc"
                break
              fi
            done
          fi
          
          if [ -z "$CERT_IDENTITY" ]; then
            echo "❌ CRITICAL ERROR: No Apple Distribution signing identity found!"
            exit 1
          fi
          
          echo "Signing IPA components with identity: $CERT_IDENTITY"
          KEYCHAIN_ARG=""
          if [ -n "$KEYCHAIN_FILE" ]; then
            KEYCHAIN_ARG="--keychain $KEYCHAIN_FILE"
          fi
          
          # Подпись фреймворков и dylib
          find /tmp/ipa_work/Payload/Forma.app -type d -name "*.framework" 2>/dev/null | while read -r fw; do
            echo "Signing framework: $fw"
            codesign --force --sign "$CERT_IDENTITY" $KEYCHAIN_ARG --timestamp=none "$fw"
          done
          
          # Подпись расширений Widgets
          find /tmp/ipa_work/Payload/Forma.app/PlugIns -type d -name "*.appex" 2>/dev/null | while read -r appex; do
            echo "Signing extension: $appex"
            W_ENT_ARG=""
            if [ -f "$appex/embedded.mobileprovision" ]; then
              security cms -D -i "$appex/embedded.mobileprovision" > /tmp/w_prov.plist
              /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' /tmp/w_prov.plist > /tmp/w_ent.plist 2>/dev/null || true
            fi
            if [ ! -f "/tmp/w_ent.plist" ] && [ -f "$ROOT_DIR/Widgets/Widgets.entitlements" ]; then
              cp "$ROOT_DIR/Widgets/Widgets.entitlements" /tmp/w_ent.plist
            fi
            if [ -f "/tmp/w_ent.plist" ]; then
              /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups array" /tmp/w_ent.plist 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups:0 string group.com.samvel.forma" /tmp/w_ent.plist 2>/dev/null || true
              W_ENT_ARG="--entitlements /tmp/w_ent.plist --generate-entitlement-der"
            fi
            codesign --force --sign "$CERT_IDENTITY" $KEYCHAIN_ARG $W_ENT_ARG --timestamp=none "$appex"
          done
          
          # Подпись Watch приложения
          find /tmp/ipa_work/Payload/Forma.app/Watch -type d -name "*.app" 2>/dev/null | while read -r subapp; do
            echo "Signing nested Watch app: $subapp"
            WATCH_ENT_ARG=""
            if [ -f "$subapp/embedded.mobileprovision" ]; then
              security cms -D -i "$subapp/embedded.mobileprovision" > /tmp/watch_prov.plist
              /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' /tmp/watch_prov.plist > /tmp/watch_ent.plist 2>/dev/null || true
              if [ -f "/tmp/watch_ent.plist" ]; then
                WATCH_ENT_ARG="--entitlements /tmp/watch_ent.plist --generate-entitlement-der"
              fi
            fi
            codesign --force --sign "$CERT_IDENTITY" $KEYCHAIN_ARG $WATCH_ENT_ARG --timestamp=none "$subapp"
          done
          
          # Подпись основного исполняемого файла и бандла Forma.app
          codesign --force --sign "$CERT_IDENTITY" $KEYCHAIN_ARG --entitlements /tmp/forma_entitlements.plist --generate-entitlement-der --timestamp=none /tmp/ipa_work/Payload/Forma.app/Forma
          codesign --force --sign "$CERT_IDENTITY" $KEYCHAIN_ARG --entitlements /tmp/forma_entitlements.plist --generate-entitlement-der --timestamp=none /tmp/ipa_work/Payload/Forma.app
          
          # Верификация подписи
          echo "=== CODESIGN VERIFICATION ==="
          codesign --verify --deep --strict --verbose=2 /tmp/ipa_work/Payload/Forma.app
          
          # Упаковка IPA
          mkdir -p build
          rm -f build/Forma.ipa
          (cd /tmp/ipa_work && zip -qr "$ROOT_DIR/build/Forma.ipa" Payload)
          rm -rf /tmp/ipa_work
          
          echo "=== IPA CONTENTS INSPECTION ==="
          unzip -l build/Forma.ipa | grep -E "embedded.mobileprovision|Info.plist|PkgInfo|_CodeSignature|AppIcon"
          
          echo "Uploading finalized build/Forma.ipa to TestFlight via xcrun altool..."
          UPLOAD_LOG="/tmp/altool_upload.log"
          xcrun altool --upload-app -f "build/Forma.ipa" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --show-progress 2>&1 | tee "$UPLOAD_LOG"
          
          if grep -qiE "UPLOAD FAILED|Validation failed|ERROR:|Error " "$UPLOAD_LOG"; then
            echo "❌ Error: xcrun altool validation or upload failed!"
            exit 1
          fi
          
          echo "✅ Uploaded to TestFlight successfully!"

      - name: Upload Artifacts (Diagnostics & dSYMs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestFlight-Build-${{ env.BUILD_NUMBER }}
          path: |
            build/*.ipa
            build/*.xcarchive/dSYMs
          if-no-files-found: ignore
          retention-days: 14
