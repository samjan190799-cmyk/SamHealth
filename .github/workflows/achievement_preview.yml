name: Achievement Animation Preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ios_achievement_preview.sh'
      - '.github/workflows/achievement_preview.yml'
      - 'Sources/GamificationViews.swift'
      - 'Sources/FormaApp.swift'

jobs:
  preview:
    name: Record achievement animation (iOS Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Record Preview
        run: |
          bash scripts/ios_achievement_preview.sh

      - name: Upload Preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Forma-Achievement-Preview
          path: achievement_preview
          if-no-files-found: ignore
          retention-days: 14
