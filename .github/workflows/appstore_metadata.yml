name: Configure App Store Metadata & Setup
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/appstore_fill.rb'
      - '.github/workflows/appstore_metadata.yml'

jobs:
  fill_metadata:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Ruby and Fastlane Spaceship
        run: |
          gem install --quiet spaceship || true

      - name: Run App Store Connect Automated Setup
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: ruby scripts/appstore_fill.rb
