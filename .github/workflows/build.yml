name: Build Forma iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Unsigned IPA for AltStore
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Show build settings (Diagnostic)
        run: |
          xcodebuild -showBuildSettings -project Forma.xcodeproj -scheme Forma || true

      - name: Build for iOS Device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Forma.xcodeproj \
            -scheme Forma \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            VALIDATE_PRODUCT=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_OPTIMIZATION_LEVEL="-O" \
            build 

          # Verify .app executable was built
          ls -l build/Build/Products/Release-iphoneos/Forma.app/Forma

      - name: Package as IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -1)
          echo "App path: $APP_PATH"
          
          # 1. Сборка полной версии (с поддержкой Apple Watch)
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/Forma.app
          cd build
          zip -r Forma.ipa Payload/
          echo "Full IPA size: $(du -h Forma.ipa | cut -f1)"
          cd ..
          
          # 2. Сборка очищенной версии (без Apple Watch) для предотвращения вылета AltStore
          mkdir -p build_nowatch/Payload
          cp -r "$APP_PATH" build_nowatch/Payload/Forma.app
          rm -rf build_nowatch/Payload/Forma.app/Watch
          cd build_nowatch
          zip -r Forma-NoWatch.ipa Payload/
          echo "No-Watch IPA size: $(du -h Forma-NoWatch.ipa | cut -f1)"
          cd ..

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Forma-Unsigned-IPA
          path: |
            build/Forma.ipa
            build_nowatch/Forma-NoWatch.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/Forma.ipa,build_nowatch/Forma-NoWatch.ipa"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: build-${{ github.run_number }}
          name: "Forma v1.0 (Build ${{ github.run_number }})"
          body: |
            ## Мобильное приложение Forma (iOS & Apple Watch)

            Для вашего удобства собраны две версии приложения:
            
            *   **Forma-NoWatch.ipa (РЕКОМЕНДУЕТСЯ для AltStore / SideStore):** 
                Специальная очищенная версия приложения без модуля Apple Watch. Используйте её, если AltStore вылетает при попытке установить стандартный пакет. Все функции на iPhone будут работать отлично.
                
            *   **Forma.ipa (Полная версия с Apple Watch):** 
                Включает приложение для часов с автоматическим считыванием повторений и автономным режимом. Установка требует использования Xcode или платных профилей подписи разработчика (из-за ограничений на количество App ID в бесплатных аккаунтах).
          allowUpdates: true
          draft: false
          prerelease: false
