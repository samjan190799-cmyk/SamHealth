name: Forma
options:
  bundleIdPrefix: com.samvel
packages:
  GoogleGenerativeAI:
    url: https://github.com/google/generative-ai-swift
    from: 0.5.0
targets:
  Forma:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Forma
        CFBundleDisplayName: Forma
        CFBundleIdentifier: com.samvel.forma
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: Forma
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Доступ к камере необходим для сканирования еды и записи видео тренировок."
        NSPhotoLibraryUsageDescription: "Доступ к галерее необходим для выбора фотографий и сохранения видео тренировок."
        NSPhotoLibraryAddUsageDescription: "Доступ к добавлению фото необходим для сохранения видео тренировок в галерею."
        NSMicrophoneUsageDescription: "Доступ к микрофону необходим для записи звука во время видео тренировок."
        NSMotionUsageDescription: "Мы используем датчики движения для круглосуточного фонового подсчета шагов, дистанции и этажей без расхода батареи."
        NSLocationWhenInUseUsageDescription: "Мы используем геопозицию для точного отслеживания дистанции и построения маршрута тренировки на карте."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Мы используем геопозицию для точного отслеживания дистанции и построения маршрута тренировки на карте."
        NSAppleMusicUsageDescription: "Мы используем доступ к Apple Music для проигрывания вашей любимой музыки во время тренировок прямо в приложении."
        NSHealthShareUsageDescription: "Мы считываем данные о шагах, активности, тренировках, весе, пульсе и сне для построения персонализированного ИИ-плана тренировок и питания."
        NSHealthUpdateUsageDescription: "Мы сохраняем ваши тренировки, записи выпитой воды и показатели веса в приложении Здоровье на устройстве."
        CFBundleURLTypes:
          - CFBundleURLName: com.samvel.forma
            CFBundleURLSchemes:
              - forma
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    entitlements:
      path: Forma.entitlements
    dependencies:
      - sdk: HealthKit.framework
      - package: GoogleGenerativeAI
        product: GoogleGenerativeAI
      - target: FormaWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samvel.forma
        CODE_SIGN_ENTITLEMENTS: Forma.entitlements
        SWIFT_VERSION: "5.9"
        PRODUCT_NAME: Forma
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ALWAYS_SEARCH_USER_PATHS: "NO"

  FormaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
      - path: Sources/FormaLiveActivityAttributes.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Forma Widgets
        CFBundleIdentifier: com.samvel.forma.widgets
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samvel.forma.widgets
        SWIFT_VERSION: "5.9"
        PRODUCT_NAME: FormaWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: "NO"

  FormaWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samvel.forma.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.samvel.forma
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        PRODUCT_NAME: FormaWatch
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

